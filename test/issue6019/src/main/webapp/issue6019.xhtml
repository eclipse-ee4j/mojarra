<html xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
>
    <h:head>
        <title>Mojarra issue 6019</title>
    </h:head>
    <h:body>
        <h:form id="form">
            <h:selectOneMenu id="rendered" value="#{issue6019.rendered}">
                <f:selectItem itemValue="#{false}" itemLabel="Hide" />
                <f:selectItem itemValue="#{true}" itemLabel="Show" />
                <f:ajax execute="@form" render="@form" />
            </h:selectOneMenu>

            <h:panelGroup id="group" rendered="#{issue6019.rendered}">
                <h:commandButton id="increment" value="Increment" action="#{issue6019.increment}">
                    <f:ajax execute="@this" render="@form" />
                </h:commandButton>
                <h:inputText id="editable" value="#{issue6019.value}" />
                <h:inputText id="readonly" value="#{issue6019.value}" readonly="true" />
            </h:panelGroup>
        </h:form>
    </h:body>
</html>
