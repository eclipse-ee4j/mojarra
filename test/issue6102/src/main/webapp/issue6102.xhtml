<html xmlns:h="jakarta.faces.html">
    <h:head>
        <title>Mojarra issue 6102 - dynamic children whose siblings before them are added or removed</title>
    </h:head>
    <h:body>
        <h:form id="form">
            <h:panelGroup id="target" layout="block">
                <h:outputText id="s0" value="S0" />
                <h:outputText id="s1" value="S1" />
            </h:panelGroup>
            <h:commandButton id="addA1" value="Add A at 1" action="#{issue6102.add('a', 1)}" />
            <h:commandButton id="addA0" value="Add A at 0" action="#{issue6102.add('a', 0)}" />
            <h:commandButton id="addA2" value="Add A at 2" action="#{issue6102.add('a', 2)}" />
            <h:commandButton id="addB0" value="Add B at 0" action="#{issue6102.add('b', 0)}" />
            <h:commandButton id="addB2" value="Add B at 2" action="#{issue6102.add('b', 2)}" />
            <h:commandButton id="removeS0" value="Remove S0" action="#{issue6102.remove('s0')}" />
            <h:commandButton id="addA1RemoveS0" value="Add A at 1 and remove S0" action="#{issue6102.addAndRemove('a', 1, 's0')}" />
            <h:commandButton id="removeA" value="Remove A" action="#{issue6102.remove('a')}" />
            <h:commandButton id="submit" value="Submit" />
        </h:form>
    </h:body>
</html>
