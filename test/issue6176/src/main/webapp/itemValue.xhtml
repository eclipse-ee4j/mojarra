<html lang="en"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:f="jakarta.faces.core"
    xmlns:h="jakarta.faces.html"
    xmlns:p="jakarta.faces.passthrough"
>
    <h:head>
        <title>f:selectItems var in pass-through attributes</title>
    </h:head>
    <h:body>
        <h:form id="form">
            <h:selectOneMenu id="menuItemValue" value="#{issue6176.one}">
                <f:selectItems value="#{issue6176.items}" var="item" itemValue="#{item.value}" p:data-flag="#{item.flag ? 'on' : 'off'}" />
            </h:selectOneMenu>

            <h:selectManyListbox id="listboxItemValue" value="#{issue6176.many}">
                <f:selectItems value="#{issue6176.items}" var="item" itemValue="#{item.value}" p:data-flag="#{item.flag ? 'on' : 'off'}" />
            </h:selectManyListbox>
        </h:form>
    </h:body>
</html>
