    <h:head>
        <title>Mojarra issue 6100 - dynamic children inserted at an index</title>
    </h:head>
    <h:body>
        <h:form id="form">
            <h:panelGroup id="target" layout="block">
                <h:outputText id="s0" value="S0" />

        </h:form>
    </h:body>
