<html lang="en"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:f="jakarta.faces.core"
    xmlns:h="jakarta.faces.html"
    xmlns:p="jakarta.faces.passthrough"
>
    <h:head>
        <title>f:selectItem and f:selectItems pass-through attributes on inputs</title>
    </h:head>
    <h:body>
        <h:form id="form">
            <h:selectManyCheckbox id="checks" value="#{issue6177.many}" p:data-select="s" p:data-both="select">
                <f:selectItem itemValue="1" itemLabel="one" p:data-item="i1" p:data-both="item" />
                <f:selectItems value="#{issue6177.items}" var="item" itemValue="#{item.value}" p:data-item="#{item.flag ? 'on' : 'off'}" />
            </h:selectManyCheckbox>

            <h:selectManyCheckbox id="checksList" value="#{issue6177.many}" layout="list" p:data-select="s" p:data-both="select">
                <f:selectItem itemValue="1" itemLabel="one" p:data-item="i1" p:data-both="item" />
                <f:selectItems value="#{issue6177.items}" var="item" itemValue="#{item.value}" p:data-item="#{item.flag ? 'on' : 'off'}" />
            </h:selectManyCheckbox>

            <h:selectManyCheckbox id="checksPage" value="#{issue6177.many}" layout="pageDirection" p:data-select="s" p:data-both="select">
                <f:selectItem itemValue="1" itemLabel="one" p:data-item="i1" p:data-both="item" />
                <f:selectItems value="#{issue6177.items}" var="item" itemValue="#{item.value}" p:data-item="#{item.flag ? 'on' : 'off'}" />
            </h:selectManyCheckbox>

            <h:selectOneRadio id="radios" value="#{issue6177.one}" p:data-select="s" p:data-both="select">
                <f:selectItem itemValue="1" itemLabel="one" p:data-item="i1" p:data-both="item" />
                <f:selectItems value="#{issue6177.items}" var="item" itemValue="#{item.value}" p:data-item="#{item.flag ? 'on' : 'off'}" />
            </h:selectOneRadio>

            <h:selectOneRadio id="radiosList" value="#{issue6177.one}" layout="list" p:data-select="s" p:data-both="select">
                <f:selectItem itemValue="1" itemLabel="one" p:data-item="i1" p:data-both="item" />
                <f:selectItems value="#{issue6177.items}" var="item" itemValue="#{item.value}" p:data-item="#{item.flag ? 'on' : 'off'}" />
            </h:selectOneRadio>

            <h:selectOneRadio id="radiosPage" value="#{issue6177.one}" layout="pageDirection" p:data-select="s" p:data-both="select">
                <f:selectItem itemValue="1" itemLabel="one" p:data-item="i1" p:data-both="item" />
                <f:selectItems value="#{issue6177.items}" var="item" itemValue="#{item.value}" p:data-item="#{item.flag ? 'on' : 'off'}" />
            </h:selectOneRadio>
        </h:form>
    </h:body>
</html>
