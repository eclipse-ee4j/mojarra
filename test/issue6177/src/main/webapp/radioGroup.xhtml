<html lang="en"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:f="jakarta.faces.core"
    xmlns:h="jakarta.faces.html"
    xmlns:p="jakarta.faces.passthrough"
>
    <h:head>
        <title>Pass-through attributes on radio inputs in group mode</title>
    </h:head>
    <h:body>
        <h:form id="form">
            <h:selectOneRadio id="radioOne" value="#{issue6177.grouped}" group="group" p:data-select="one" p:data-both="select">
                <f:selectItems value="#{issue6177.items}" var="item" itemValue="#{item.value}" p:data-item="#{item.flag ? 'on' : 'off'}" p:data-both="item" />
            </h:selectOneRadio>
            <h:selectOneRadio id="radioTwo" value="#{issue6177.grouped}" group="group" p:data-select="two" p:data-both="select" />

            <h:selectOneRadio id="mapRadioOne" value="#{issue6177.grouped}" group="mapGroup" p:data-map="one">
                <f:selectItems value="#{issue6177.map}" var="entry" p:data-key="#{entry.key}" />
            </h:selectOneRadio>
            <h:selectOneRadio id="mapRadioTwo" value="#{issue6177.grouped}" group="mapGroup" p:data-map="two" />
        </h:form>
    </h:body>
</html>
