<html lang="en"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:f="jakarta.faces.core"
    xmlns:h="jakarta.faces.html"
    xmlns:p="jakarta.faces.passthrough"
>
    <h:head>
        <title>Group pass-through attributes on nested tables</title>
    </h:head>
    <h:body>
        <h:form id="form">
            <h:selectManyCheckbox id="checksGroups" value="#{issue6177.many}" p:data-select="s">
                <f:selectItemGroups value="#{issue6177.categories}" var="category" itemLabel="#{category.name}" p:data-group="#{category.name}">
                    <f:selectItems value="#{category.values}" p:data-inner="inner" />
                </f:selectItemGroups>
            </h:selectManyCheckbox>

            <h:selectOneRadio id="radiosGroups" value="#{issue6177.one}" layout="pageDirection" p:data-select="s">
                <f:selectItemGroups value="#{issue6177.categories}" var="category" itemLabel="#{category.name}" p:data-group="#{category.name}">
                    <f:selectItems value="#{category.values}" p:data-inner="inner" />
                </f:selectItemGroups>
            </h:selectOneRadio>

            <h:selectManyCheckbox id="checksSelectItems" value="#{issue6177.many}" layout="list" p:data-select="s" p:data-both="select">
                <f:selectItems value="#{issue6177.selectItems}" var="item" p:data-group="#{item.label}" p:data-both="item" />
            </h:selectManyCheckbox>
        </h:form>
    </h:body>
</html>
