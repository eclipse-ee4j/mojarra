<ui:composition
    xmlns:h="jakarta.faces.html"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:t="jakarta.faces.composite/issue6161"
>
    <h:form id="form">
        <h:inputText id="plain" value="#{issue6161.plain}" valueChangeListener="#{issue6161.valueChanged}" validator="#{issue6161.validate}" />
        <h:commandButton id="plainButton" value="Submit" actionListener="#{issue6161.action}" />

        <t:listeners id="composite" value="#{issue6161.composite}" valueChangeListener="#{issue6161.valueChanged}" validator="#{issue6161.validate}" actionListener="#{issue6161.action}" />

        <h:dataTable id="table" value="#{issue6161.rows}" var="row" rowStatePreserved="true">
            <h:column>
                <h:inputText id="input" value="#{row.value}" valueChangeListener="#{issue6161.valueChanged}" validator="#{issue6161.validate}" />
                <h:commandButton id="button" value="Submit" actionListener="#{issue6161.action}" />
            </h:column>
        </h:dataTable>

        <h:outputText id="events" value="#{issue6161.events}" />
    </h:form>
</ui:composition>
