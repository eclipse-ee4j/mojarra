<ui:component
    xmlns:h="jakarta.faces.html"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:cc="jakarta.faces.composite"
>
    <cc:interface>
        <cc:attribute name="value" />
        <cc:attribute name="valueChangeListener" targets="input" method-signature="void valueChangeListener(jakarta.faces.event.ValueChangeEvent)" />
        <cc:attribute name="validator" targets="input" method-signature="void validator(jakarta.faces.context.FacesContext, jakarta.faces.component.UIComponent, java.lang.Object)" />
        <cc:attribute name="actionListener" targets="button" method-signature="void actionListener(jakarta.faces.event.ActionEvent)" />
    </cc:interface>
    <cc:implementation>
        <h:inputText id="input" value="#{cc.attrs.value}" />
        <h:commandButton id="button" value="Submit" />
    </cc:implementation>
</ui:component>
