<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:c="jakarta.tags.core">
    <h:head><title>conditional</title></h:head>
    <h:body>
        <h:form id="form">
            <h:commandButton id="show" value="show" action="#{restoreBuildTimeDecisionsBean.show}" />
            <c:if test="#{restoreBuildTimeDecisionsBean.shown}">
                <h:inputText id="input" value="#{restoreBuildTimeDecisionsBean.value}" />
            </c:if>
            <h:commandButton id="submit" value="submit" />
            <h:commandButton id="ajaxSubmit" value="ajax submit">
                <f:ajax execute="form" render="form" />
            </h:commandButton>
            <h:outputText id="value" value="#{restoreBuildTimeDecisionsBean.value}" />
        </h:form>
    </h:body>
</html>
