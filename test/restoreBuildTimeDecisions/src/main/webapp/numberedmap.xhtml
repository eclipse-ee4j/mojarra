<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:c="jakarta.tags.core">
    <h:head><title>numbered map</title></h:head>
    <h:body>
        <h:form id="form">
            <h:commandButton id="show" value="show" action="#{restoreBuildTimeDecisionsBean.show}" />
            <c:forEach items="#{restoreBuildTimeDecisionsRows.numbers}" begin="0" end="#{restoreBuildTimeDecisionsBean.shown ? 1 : -1}"
                       var="entry" varStatus="loop">
                <h:inputText id="input#{loop.index}" value="#{restoreBuildTimeDecisionsRows.numbers[entry.key]}" />
            </c:forEach>
            <h:commandButton id="submit" value="submit" />
            <h:outputText id="numbers" value="#{restoreBuildTimeDecisionsRows.numbers}" />
        </h:form>
    </h:body>
</html>
