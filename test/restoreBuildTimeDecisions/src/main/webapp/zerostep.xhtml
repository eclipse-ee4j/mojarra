<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:c="jakarta.tags.core">
    <h:head><title>zero step</title></h:head>
    <h:body>
        <h:form id="form">
            <c:forEach items="#{restoreBuildTimeDecisionsRows.items}" begin="0" end="1" step="0" var="row">
                <h:outputText value="[#{row.name}]" />
            </c:forEach>
            <h:inputText id="input" value="#{restoreBuildTimeDecisionsBean.value}" />
            <h:commandButton id="submit" value="submit" />
            <h:outputText id="value" value="#{restoreBuildTimeDecisionsBean.value}" />
        </h:form>
    </h:body>
</html>
