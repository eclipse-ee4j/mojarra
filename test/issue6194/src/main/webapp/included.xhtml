<html lang="en"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:c="jakarta.tags.core"
    xmlns:f="jakarta.faces.core"
    xmlns:h="jakarta.faces.html"
    xmlns:ui="jakarta.faces.facelets"
>
    <h:head>
        <title>Included rows admitted by a c:if inside a c:forEach</title>
    </h:head>
    <h:body>
        <h:form id="form">
            <h:selectBooleanCheckbox id="evenOnly" value="#{issue6194.evenOnly}">
                <f:ajax render="rows created" />
            </h:selectBooleanCheckbox>
            <h:panelGroup id="rows" layout="block">
                <c:forEach items="#{issue6194.items}" var="item">
                    <c:if test="#{not issue6194.evenOnly or item % 2 eq 0}">
                        <ui:include src="/WEB-INF/includes/row.xhtml" />
                    </c:if>
                </c:forEach>
            </h:panelGroup>
            <h:outputText id="created" value="#{issue6194Creations.rows}" />
        </h:form>
    </h:body>
</html>
