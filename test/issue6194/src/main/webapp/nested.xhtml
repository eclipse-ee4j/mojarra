<html lang="en"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:c="jakarta.tags.core"
    xmlns:f="jakarta.faces.core"
    xmlns:h="jakarta.faces.html"
>
    <h:head>
        <title>Groups admitted by a c:if around a nested c:forEach</title>
    </h:head>
    <h:body>
        <h:form id="form">
            <h:selectBooleanCheckbox id="skipFirstGroup" value="#{issue6194.skipFirstGroup}">
                <f:ajax render="rows" />
            </h:selectBooleanCheckbox>
            <h:panelGroup id="rows" layout="block">
                <c:forEach items="#{issue6194.groups}" var="group" varStatus="loop">
                    <c:if test="#{not issue6194.skipFirstGroup or not loop.first}">
                        <c:forEach items="#{group}" var="item">
                            <h:outputText value="[#{item}]" />
                        </c:forEach>
                    </c:if>
                </c:forEach>
            </h:panelGroup>
        </h:form>
    </h:body>
</html>
