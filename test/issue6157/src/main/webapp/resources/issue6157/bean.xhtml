<ui:component xmlns:cc="jakarta.faces.composite" xmlns:c="jakarta.tags.core" xmlns:f="jakarta.faces.core" xmlns:h="jakarta.faces.html" xmlns:ui="jakarta.faces.facelets">
    <cc:interface>
        <cc:attribute name="kind" />
        <cc:attribute name="bean" />
    </cc:interface>
    <cc:implementation>
        <c:if test="#{cc.attrs.kind eq 'event'}">
            <h:outputText value="button"><f:event type="preRenderComponent" listener="#{cc.attrs.bean.noArg}" /></h:outputText>
        </c:if>
        <c:if test="#{cc.attrs.kind eq 'ajax'}">
            <h:commandButton id="button" value="button"><f:ajax listener="#{cc.attrs.bean.noArg}" render=":ajax:invoked" /></h:commandButton>
        </c:if>
        <c:if test="#{cc.attrs.kind eq 'action'}">
            <h:commandButton id="button" value="button" actionListener="#{cc.attrs.bean.noArg}" />
        </c:if>
        <c:if test="#{cc.attrs.kind eq 'value'}">
            <h:inputText id="input" value="#{issue6157.value}" valueChangeListener="#{cc.attrs.bean.noArg}" />
        </c:if>
    </cc:implementation>
</ui:component>
