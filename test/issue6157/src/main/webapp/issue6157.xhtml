<html xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core" xmlns:i="jakarta.faces.composite/issue6157">

    <h:body>

        </h:form>
        <h:form id="action_noArg">
            <h:commandButton id="button" value="noArg" actionListener="#{issue6157.actionNoArg}" />

        </h:form>
        <h:form id="action_oneArg">

        <h:form id="value_noArg">
            <h:inputText id="input" value="#{issue6157.value}" valueChangeListener="#{issue6157.valueNoArg}" />

            <h:outputText id="invoked" value="#{issue6157.invoked}" />
