<ui:composition xmlns:c="jakarta.tags.core" xmlns:f="jakarta.faces.core" xmlns:h="jakarta.faces.html" xmlns:ui="jakarta.faces.facelets">
    <c:if test="#{kind eq 'event'}">
        <h:outputText value="include"><f:event type="preRenderComponent" listener="#{bean.noArg}" /></h:outputText>
    </c:if>
    <c:if test="#{kind eq 'ajax'}">
        <h:commandButton id="include" value="include"><f:ajax listener="#{bean.noArg}" render=":ajax:invoked" /></h:commandButton>
    </c:if>
    <c:if test="#{kind eq 'action'}">
        <h:commandButton id="include" value="include" actionListener="#{bean.noArg}" />
    </c:if>
    <c:if test="#{kind eq 'value'}">
        <h:inputText id="input" value="#{issue6157.value}" valueChangeListener="#{bean.noArg}" />
    </c:if>
</ui:composition>
