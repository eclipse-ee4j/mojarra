<html lang="en"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:f="jakarta.faces.core"
    xmlns:h="jakarta.faces.html"
    xmlns:ui="jakarta.faces.facelets"
>
    <h:head>
        <title>Include following the current step</title>
    </h:head>
    <h:body>
        <h:form id="form">
            <h:outputText id="step" value="step #{issue6189.step}" />
            <h:panelGroup id="include" layout="block">
                <ui:include src="/WEB-INF/includes/step#{issue6189.step}.xhtml" />
            </h:panelGroup>
            <h:commandButton id="next" value="next">
                <f:ajax listener="#{issue6189.next}" execute="@form" render="@form" />
            </h:commandButton>
            <h:commandButton id="nextAndBuildOtherView" value="next and build other view">
                <f:ajax listener="#{issue6189.nextAndBuildOtherView}" execute="@form" render="@form" />
            </h:commandButton>
        </h:form>
    </h:body>
</html>
