<html lang="en"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:f="jakarta.faces.core"
    xmlns:h="jakarta.faces.html"
    xmlns:p="jakarta.faces.passthrough"
>
    <h:head>
        <title>Pass-through attributes of the nested items of f:selectItemGroups</title>
    </h:head>
    <h:body>
        <h:form id="form">
            <h:selectOneMenu id="menu" value="#{issue6186.one}">
                <f:selectItemGroups value="#{issue6186.categories}" var="category" itemLabel="#{category.name}" p:data-group="#{category.name}">
                    <f:selectItem itemValue="#{category.name}" itemLabel="All" p:data-sku="all" p:data-category="#{category.name}" />
                    <f:selectItems value="#{category.products}" var="product" itemValue="#{product.sku}" itemLabel="#{product.name}"
                        p:data-sku="#{product.sku}" p:data-category="#{category.name}" />
                </f:selectItemGroups>
            </h:selectOneMenu>

            <h:selectManyCheckbox id="checks" value="#{issue6186.many}" p:data-select="s">
                <f:selectItemGroups value="#{issue6186.categories}" var="category" itemLabel="#{category.name}" p:data-group="#{category.name}">
                    <f:selectItem itemValue="#{category.name}" itemLabel="All" p:data-sku="all" p:data-category="#{category.name}" />
                    <f:selectItems value="#{category.products}" var="product" itemValue="#{product.sku}" itemLabel="#{product.name}"
                        p:data-sku="#{product.sku}" p:data-category="#{category.name}" />
                </f:selectItemGroups>
            </h:selectManyCheckbox>

            <h:selectOneRadio id="radios" value="#{issue6186.one}" layout="pageDirection" p:data-select="s">
                <f:selectItemGroups value="#{issue6186.categories}" var="category" itemLabel="#{category.name}" p:data-group="#{category.name}">
                    <f:selectItem itemValue="#{category.name}" itemLabel="All" p:data-sku="all" p:data-category="#{category.name}" />
                    <f:selectItems value="#{category.products}" var="product" itemValue="#{product.sku}" itemLabel="#{product.name}"
                        p:data-sku="#{product.sku}" p:data-category="#{category.name}" />
                </f:selectItemGroups>
            </h:selectOneRadio>
        </h:form>
    </h:body>
</html>
