<html lang="en"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:f="jakarta.faces.core"
    xmlns:h="jakarta.faces.html"
    xmlns:p="jakarta.faces.passthrough"
>
    <h:head>
        <title>Pass-through attributes of the items around a group of f:selectItems</title>
    </h:head>
    <h:body>
        <h:form id="form">
            <h:selectOneMenu id="menu" value="#{issue6186.one}">
                <f:selectItems value="#{issue6186.selectItems}" var="item" p:data-item="#{item.label}" />
            </h:selectOneMenu>

            <h:selectManyCheckbox id="checks" value="#{issue6186.many}" layout="list" p:data-select="s" p:data-both="select">
                <f:selectItems value="#{issue6186.selectItems}" var="item" p:data-item="#{item.label}" p:data-both="item" />
            </h:selectManyCheckbox>
        </h:form>
    </h:body>
</html>
