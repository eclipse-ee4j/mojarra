<html lang="en"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:faces="jakarta.faces"
    xmlns:h="jakarta.faces.html"
>
    <h:head>
        <title>Pass-through elements without selector attribute</title>
    </h:head>
    <h:body>
        <h:form id="form">
            <a href="#" faces:id="link">link</a>
            <a href="#" faces:rendered="#{true}" data-case="shownLink">shown link</a>
            <a href="#" faces:rendered="#{false}" data-case="hiddenLink">hidden link</a>
            <input faces:id="input" />
            <input faces:rendered="#{true}" data-case="shownInput" />
            <input faces:rendered="#{false}" data-case="hiddenInput" />
        </h:form>
    </h:body>
</html>
