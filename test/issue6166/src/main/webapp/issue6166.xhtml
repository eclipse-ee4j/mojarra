<html lang="en"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:c="jakarta.tags.core"
    xmlns:f="jakarta.faces.core"
    xmlns:h="jakarta.faces.html"
>
    <h:head>
        <title>c:forEach after siblings</title>
    </h:head>
    <h:body>
        <h:form id="form">
            <!-- Two c:forEach over a list, each preceded by components of the same parent. -->
            <h:panelGroup id="components" layout="block">
                <h:outputText value="[before]" />
                <c:forEach items="#{['one', 'two']}" var="item">
                    <h:outputText value="[#{item}]" />
                </c:forEach>
                <h:outputText value="[between]" />
                <c:forEach items="#{['three', 'four']}" var="item">
                    <h:outputText value="[#{item}]" />
                </c:forEach>
                <h:outputText value="[after]" />
            </h:panelGroup>
            <!-- A c:forEach over a list, preceded by template text of the same parent. -->
            <h:panelGroup id="text" layout="block">
                [before]
                <c:forEach items="#{['one', 'two']}" var="item">[#{item}]</c:forEach>
                [after]
            </h:panelGroup>
            <h:commandButton id="ajaxSubmit" value="Ajax submit">
                <f:ajax execute="@form" render="@form" />
            </h:commandButton>
            <h:commandButton id="nonAjaxSubmit" value="Non-ajax submit" />
            <!-- A c:forEach over a map cannot have its build reproduced, so the view is re-applied before rendering. -->
            <c:forEach items="#{{'label': 'Label'}}" var="label">
                <h:outputText value="#{label.value}" />
            </c:forEach>
        </h:form>
    </h:body>
</html>
