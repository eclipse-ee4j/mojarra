<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:c="jakarta.tags.core">
    <h:head><title>swapped conditional</title></h:head>
    <h:body>
        <h:form id="form">
            <!-- block -->
            <h:outputText id="first" value="first" />
            <c:if test="#{swappedBlocksBean.a}">
                <h:inputText id="inputA" value="#{swappedBlocksBean.valueA}" />
            </c:if>
            <!-- block -->
            <h:outputText id="second" value="second" />
            <c:if test="#{swappedBlocksBean.b}">
                <h:inputText id="inputB" value="#{swappedBlocksBean.valueB}" />
            </c:if>
            <!-- block -->
            <h:commandButton id="submit" value="submit" />
            <h:outputText id="value" value="#{swappedBlocksBean.valueA}" />
        </h:form>
    </h:body>
</html>
