<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:c="jakarta.tags.core">
    <h:head><title>swapped iteration</title></h:head>
    <h:body>
        <h:form id="form">
            <!-- block -->
            <h:outputText id="first" value="first" />
            <c:forEach items="#{swappedBlocksBean.foos}" var="i">
                <h:inputText id="foo_#{i}" value="#{swappedBlocksBean.values[i]}" />
            </c:forEach>
            <!-- block -->
            <h:outputText id="second" value="second" />
            <c:forEach items="#{swappedBlocksBean.bars}" var="i">
                <h:inputText id="bar_#{i}" value="#{swappedBlocksBean.values[i]}" />
            </c:forEach>
            <!-- block -->
            <h:commandButton id="submit" value="submit" />
            <h:outputText id="values" value="#{swappedBlocksBean.values}" />
        </h:form>
    </h:body>
</html>
