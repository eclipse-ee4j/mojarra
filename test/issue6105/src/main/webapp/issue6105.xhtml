<html lang="en"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:c="jakarta.tags.core"
    xmlns:f="jakarta.faces.core"
    xmlns:h="jakarta.faces.html"
    xmlns:t="jakarta.faces.composite/issue6105"
>
    <h:head>
        <title>c:forEach inside cc:insertChildren</title>
    </h:head>
    <h:body>
        <h:form id="form">
            <t:menu id="composite" value="#{requestScope.selected}">
                <c:forEach items="#{['one', 'two', 'three']}" var="item">
                    <f:selectItem itemValue="#{item}" itemLabel="#{item}" />
                </c:forEach>
            </t:menu>
            <h:commandButton id="ajaxSubmit" value="Ajax submit">
                <f:ajax execute="@form" render="@form" />
            </h:commandButton>
            <h:commandButton id="nonAjaxSubmit" value="Non-ajax submit" />
            <!-- A c:forEach over a map cannot have its build reproduced, so the view is re-applied before rendering. -->
            <c:forEach items="#{{'label': 'Label'}}" var="label">
                <h:outputText value="#{label.value}" />
            </c:forEach>
            <h:outputText id="selected" value="#{requestScope.selected[0]}" />
        </h:form>
    </h:body>
</html>
